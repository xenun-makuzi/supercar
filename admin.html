<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Super Car Parts</title>
<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<meta name="theme-color" content="#111317">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#d3081f;--red2:#a30616;--ink:#111317;--mut:#68707c;--line:#e3e5e9;--soft:#f4f5f7}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:15px/1.5 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--soft)}
h1,h2{font-family:'Barlow Condensed',sans-serif;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd3d9;border-radius:4px;background:#fff}
.btn{width:auto;background:var(--red);color:#fff;border:2px solid var(--red);border-radius:4px;padding:9px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--red2);border-color:var(--red2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.line{background:#fff;color:var(--ink);border-color:#cfd3d9}
.btn.line:hover{border-color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn.line.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.muted{color:var(--mut)}
.err,#le{color:var(--red)}

#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#lf{display:grid;gap:14px;width:100%;max-width:400px;padding:36px;background:#fff;border:1px solid var(--line);border-radius:8px}
#lf h1{font-size:34px}
label{display:grid;gap:5px;font-weight:600;font-size:14px;align-content:start}

#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 0;background:var(--ink);color:#d7dae0}
.brand{display:flex;gap:10px;align-items:center;padding:0 24px 22px;font:700 26px 'Barlow Condensed',sans-serif;color:#fff}
.brand i{width:6px;height:26px;background:var(--red);transform:skewX(-14deg)}
#nav a{display:flex;justify-content:space-between;gap:8px;padding:11px 24px;border-left:3px solid transparent;color:inherit;text-decoration:none}
#nav a:hover,#nav a.on{background:#1b1e24;color:#fff}
#nav a.on{border-left-color:var(--red)}
.badge{padding:0 8px;border-radius:10px;background:var(--red);color:#fff;font-size:13px}
.badge:empty{display:none}
aside footer{margin-top:auto;display:grid;gap:10px;justify-items:start;padding:16px 24px;font-size:13px}
aside footer a{color:#fff}
main{min-width:0;padding:32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
#title{font-size:38px}

.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.bar input{max-width:280px}
.bar select{max-width:220px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
th{background:#fafbfc;color:var(--mut);font-size:13px;font-weight:600}
td.r{text-align:right;white-space:nowrap}
.th{display:block;width:56px;height:42px;object-fit:contain;background:var(--soft);border-radius:3px}

.req{display:grid;gap:12px;margin-bottom:14px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:6px}
.req header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.req header b{margin-right:10px;font:700 22px 'Barlow Condensed',sans-serif}
.req time{color:var(--mut);font-size:13px}
.pill{padding:2px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;text-transform:capitalize}
.pill.order{background:var(--red);color:#fff}
.req dl{display:grid;grid-template-columns:110px 1fr;gap:2px 12px}
.req dt{color:var(--mut)}
.det{padding:12px;background:var(--soft);border-radius:4px;white-space:pre-wrap}
.req footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.req .links{display:flex;flex-wrap:wrap;gap:16px;margin-right:auto}
.req .links a{color:var(--red);font-weight:600}
.req select{width:auto}

.oi{width:100%;border-collapse:collapse}
.oi td,.oi th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
.oi .r{text-align:right}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:16px 0 20px}
.slot{display:grid;gap:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:6px}
.slot img{width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--soft);border-radius:4px}

dialog{width:min(720px,calc(100% - 24px));margin:auto;padding:28px;border:0;border-radius:8px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.wide{grid-column:1/-1}
.img{display:flex;align-items:center;gap:12px}
.img img{width:96px;height:72px;object-fit:contain;background:var(--soft);border-radius:4px}
.end{display:flex;justify-content:flex-end;gap:10px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border-radius:6px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--red)}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:16px 0 0}
  #nav{display:flex;overflow-x:auto}
  #nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  #nav a.on{border-bottom-color:var(--red)}
  aside footer{margin-top:0;grid-auto-flow:column;justify-content:space-between;align-items:center;width:100%}
  main{padding:20px 14px}
  .fg{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="login">
  <form id="lf">
    <h1>Super Car Parts admin</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="le" role="alert"></p>
    <button class="btn">Sign in</button>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand"><i></i>Super Car Parts</div>
    <nav id="nav">
      <a data-k="requests" href="#requests">Orders and quotes<span class="badge" id="nb"></span></a>
      <a data-k="brands" href="#brands">Manufacturers</a>
      <a data-k="models" href="#models">Models</a>
      <a data-k="categories" href="#categories">Part types</a>
      <a data-k="products" href="#products">Products</a>
      <a data-k="hero" href="#hero">Home hero images</a>
    </nav>
    <footer><span id="who"></span><button class="btn line sm" id="out">Sign out</button><a href="index.html">View site</a></footer>
  </aside>
  <main>
    <div class="top"><h1 id="title"></h1><div id="act"></div></div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form id="f"></form></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
